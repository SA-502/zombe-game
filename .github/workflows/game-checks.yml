name: ASHFALL game checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check game and Blender integration
        working-directory: outputs/house-game
        run: node check.mjs
